apiVersion: v2
name: keycloak-operator
description: Deploy Keycloak Operator and Keycloak
type: application
version: 1.13.1
appVersion: "26.7.4"
icon: https://www.keycloak.org/resources/images/logo-stacked.svg
home: https://www.keycloak.org
sources:
  - https://github.com/keycloak/keycloak-k8s-resources
  - https://github.com/adfinis/helm-charts/tree/main/charts/keycloak-operator
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated Keycloak and Keycloak Operator from 26.7.2 to 26.7.4, including security fixes for:
          - CVE-2026-90997: default MySQL/MariaDB row counts make stateless replay gates accept reused artifacts
          - CVE-2026-79651: unauthenticated denial of service via unbounded locale caching
          - CVE-2026-74909: percent-encoded semicolon bypasses matrix parameter stripping in PathMatcher
          - CVE-2026-19607: username takeover leading to account lockout
          - CVE-2026-17526: privilege escalation allowing the "impersonation" role to impersonate a realm administrator
          - CVE-2026-18212: SAML redirect DEFLATE helpers leak native zlib state
          - CVE-2026-35563: LDAP client implementation does not verify if the server certificate matches the intended hostname
          - CVE-2026-16093: required signed-JWT assertion policy bypass via unsigned assertion headers
          - CVE-2026-16072: organization managers can create managed members through stored registration links without permissions
          - CVE-2026-16108: realm default-group reads disclose hidden groups under FGAP v2
          - CVE-2026-16105: missing per-role authorization on RoleContainerResource composite endpoints
          - CVE-2026-16089: authorization codes can be retargeted to another client session
          - CVE-2026-16104: authenticator config surfaces expose raw reCAPTCHA secrets
          - CVE-2026-16106: incorrect authorization allows delegated admin to remove privileged child roles
          - CVE-2026-17059: user PII disclosure via GET /roles/{role}/users due to missing per-user view filter
          - CVE-2026-18218: client not-before revocation is ignored when realm not-before is older but nonzero
          - CVE-2026-18215: Microsoft external access-token exchange bypasses configured tenant token-exchange
          - CVE-2026-18201: generic identity-provider creation binds brokers to organizations without permissions
          - CVE-2026-18209: redirect_uri OIDC response-parameter injection bypass via URL fragment
          - CVE-2026-18214: Google external access-token exchange bypasses hosted-domain restriction
          - CVE-2026-18571: group assignment bypass during user creation allows adding unpermitted groups
          - CVE-2026-18572: UMA claim token can override the authorization time-policy clock
          - CVE-2026-18573: client access-type condition evaluates updates against the old client type
          - CVE-2026-18570: full-scope-disabled client policy validation bypass
          - CVE-2026-19729: relative path traversal enabling filesystem probing
          - CVE-2026-79652: jwt-bearer authorization grant does not enforce consentRequired
      links:
        - name: Release notes 26.7.4
          url: https://github.com/keycloak/keycloak/releases/tag/26.7.4
        - name: Release notes 26.7.3
          url: https://github.com/keycloak/keycloak/releases/tag/26.7.3
        - name: Migration guide
          url: https://www.keycloak.org/docs/latest/upgrading/index.html
