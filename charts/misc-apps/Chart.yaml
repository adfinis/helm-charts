apiVersion: v2
name: misc-apps
description: Argo CD app-of-apps config for miscellaneous small tools
type: application
version: 0.72.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/misc-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated OpenCost to 2.5.26, including:
          - OpenCost app updates from v1.120.1 to v1.120.4
          - Plugin installation list and existingSecret support
          - OCI cloud cost configuration example
          - Gateway API filter support
          - extraObjects support for tpl-rendered extra manifests
          - Fixes for UI route TLS, service debug targetPort, namespace helper usage, and probe timeout overrides
      links:
        - name: "2.5.26 Release Notes"
          url: https://github.com/opencost/opencost-helm-chart/releases/tag/opencost-2.5.26
