apiVersion: v2
name: misc-apps
description: Argo CD app-of-apps config for miscellaneous small tools
type: application
version: 0.83.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/misc-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated Goldilocks chart from 11.1.0 to 11.2.0, including:
          - Goldilocks application update from v4.16.1 to v4.16.2
          - Updated libcrypto3, libssl3, and Go to fix vulnerabilities
          - Added a metrics endpoint to the Goldilocks controller
          - Updated the bundled VPA chart from 5.0.* to 5.1.*
      links:
        - name: "Goldilocks v4.16.2 release notes"
          url: https://github.com/FairwindsOps/goldilocks/releases/tag/v4.16.2
        - name: "Goldilocks vulnerability fixes"
          url: https://github.com/FairwindsOps/goldilocks/pull/889
        - name: "Goldilocks changes from v4.16.1 to v4.16.2"
          url: https://github.com/FairwindsOps/goldilocks/compare/v4.16.1...v4.16.2
