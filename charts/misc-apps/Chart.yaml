apiVersion: v2
name: misc-apps
description: Argo CD app-of-apps config for miscellaneous small tools
type: application
version: 0.74.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/misc-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated MetalLB to 0.16.1, including:
          - FRR-K8s is now the default BGP backend and FRR mode is deprecated
          - BGP localASN support for per-peer local-AS overrides
          - ServiceSelector support for advertisement resources
          - Native HTTPS metrics with TLS/RBAC replacing kube-rbac-proxy
          - Configurable memberlist and BGP debounce settings
          - frr-k8s dependency update to 0.0.25 and FRR-mode updates
          - Fixes for Helm rendering, HTTPS metrics scraping, controller health probes, BGPPeer schema, L2 speaker election, and BGP resource scoping
      links:
        - name: "MetalLB 0.16.1 Release Notes"
          url: https://metallb.universe.tf/release-notes/#version-0-16-1
        - name: "MetalLB 0.16.0 Release Notes"
          url: https://metallb.universe.tf/release-notes/#version-0-16-0
