apiVersion: v2
name: misc-apps
description: Argo CD app-of-apps config for miscellaneous small tools
type: application
version: 0.78.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/misc-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated Reloader chart from 2.2.11 to 2.2.16, including:
          - Reloader application update from v1.4.16 to v1.4.21
          - Updated golang.org/x/text to fix CVE-2026-56852
          - Prevented a panic caused by invalid regular expressions in reload annotations
          - Added runtimeClassName and schedulerName support for the Reloader deployment
          - Corrected the namespace selector helper documentation
      links:
        - name: "Reloader chart 2.2.16 release notes"
          url: https://github.com/stakater/Reloader/releases/tag/chart-v2.2.16
        - name: "Reloader v1.4.21 release notes"
          url: https://github.com/stakater/Reloader/releases/tag/v1.4.21
        - name: "Chart changes from 2.2.11 to 2.2.16"
          url: https://github.com/stakater/Reloader/compare/chart-v2.2.11...chart-v2.2.16
