apiVersion: v2
name: security-apps
description: Argo CD app-of-apps config for security applications
type: application
version: 0.143.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/security-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated Kyverno and Kyverno Policies charts from 3.9.0 to 3.9.1, including:
          - Kyverno application update from v1.19.0 to v1.19.1
          - Fixed an SSRF and service account token egress controls bypass in legacy API calls and global context entries
          - Updated Go and dependencies to address CVE-2026-39821, CVE-2026-56853, and CVE-2026-56858
          - Fixed PolicyException scope and namespace-isolation bypasses
          - Fixed file descriptor and memory leaks when reading OCI image layers
          - Added CEL autogen support for custom workload CRDs
      links:
        - name: "Kyverno v1.19.1 release notes"
          url: https://github.com/kyverno/kyverno/releases/tag/v1.19.1
        - name: "GHSA-q825-p383-r9v5 security advisory"
          url: https://github.com/kyverno/kyverno/security/advisories/GHSA-q825-p383-r9v5
        - name: "Changes from v1.19.0 to v1.19.1"
          url: https://github.com/kyverno/kyverno/compare/v1.19.0...v1.19.1
