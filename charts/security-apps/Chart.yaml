apiVersion: v2
name: security-apps
description: Argo CD app-of-apps config for security applications
type: application
version: 0.125.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/security-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated Vault to 0.34.0, including:
          - Default Vault image update from 1.21.2 to 2.0.3
          - vault-k8s update to 1.7.5
          - vault-csi-provider update to 1.7.3
          - Kubernetes Gateway API HTTPRoute support
          - Vault Enterprise redundancy zones support
          - Tested with Vault 2.0.3 and Vault 1.21 through 1.19
      links:
        - name: "Vault chart 0.34.0"
          url: https://github.com/hashicorp/vault-helm/releases/tag/v0.34.0
        - name: "Vault chart 0.33.0"
          url: https://github.com/hashicorp/vault-helm/releases/tag/v0.33.0
