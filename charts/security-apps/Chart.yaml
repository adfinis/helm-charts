apiVersion: v2
name: security-apps
description: Argo CD app-of-apps config for security applications
type: application
version: 0.144.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/security-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated OpenBao chart from 0.29.4 to 0.30.0, including:
          - OpenBao application update from v2.6.2 to v2.7.0
          - BREAKING: changed the standalone storage backend to PebbleDB; manual migration is required
          - Fixed authorization, namespace isolation, plugin execution, audit log data exposure, ACME SAN validation, and OIDC security issues
          - Removed several built-in seals, auth engines, and secret engines in favor of external plugins
          - Added external keys, post-quantum cryptography, PostgreSQL read scalability, and strong consistency controls
          - Added signatures for Helm charts and OCI artifacts
          - Added resource-specific metadata support to the Snapshot Agent
      links:
        - name: "OpenBao Helm chart 0.30.0 release notes"
          url: https://github.com/openbao/openbao-helm/releases/tag/openbao-0.30.0
        - name: "OpenBao v2.7.0 release notes"
          url: https://github.com/openbao/openbao/releases/tag/v2.7.0
        - name: "Standalone storage migration guide"
          url: https://openbao.org/docs/guides/migrations/k8s-pebbledb
        - name: "Chart changes from 0.29.4 to 0.30.0"
          url: https://github.com/openbao/openbao-helm/compare/openbao-0.29.4...openbao-0.30.0
