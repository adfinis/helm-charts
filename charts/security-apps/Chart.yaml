apiVersion: v2
name: security-apps
description: Argo CD app-of-apps config for security applications
type: application
version: 0.124.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/security-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated StackRox central and secured cluster services to 400.11.1, including:
          - Update StackRox app images from 4.10.1 to 4.11.1
          - Enhanced vulnerability management reporting
          - Red Hat hardened image scanning
          - Policy scope support for cluster and namespace labels
          - Detection and enforcement for oc debug and pod attach operations
          - Compliance Operator tailored profile scheduling and maintenance
          - Performance improvements for scanning, runtime collection, admission control, and API list operations
          - Bug fixes and security updates from 4.11.1
          - Direct Helm chart installation is deprecated in RHACS 4.11
      links:
        - name: "StackRox 4.11.1"
          url: https://github.com/stackrox/stackrox/releases/tag/4.11.1
        - name: "RHACS 4.11 Release Notes"
          url: https://docs.redhat.com/en/documentation/red_hat_advanced_cluster_security_for_kubernetes/4.11/html/release_notes/release-notes-411
