apiVersion: v2
name: security-apps
description: Argo CD app-of-apps config for security applications
type: application
version: 0.141.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/security-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated NeuVector core and monitor charts from 2.11.1 to 2.11.2, including:
          - NeuVector application update from v5.6.1 to v5.6.2
          - NeuVector monitor update from v1.0.18 to v1.0.19
          - Fixed admission-control and logout bypass vulnerabilities
          - Fixed SAML and OpenID user identification and SAML audience validation vulnerabilities
          - Fixed packet-capture filter command injection that could lead to remote code execution
          - Updated golang.org/x/crypto and other dependencies
          - Added Traefik ingress support
      links:
        - name: "NeuVector v5.6.2 release notes"
          url: https://github.com/neuvector/neuvector/releases/tag/v5.6.2
        - name: "NeuVector changes from v5.6.1 to v5.6.2"
          url: https://github.com/neuvector/neuvector/compare/v5.6.1...v5.6.2
        - name: "Chart changes from 2.11.1 to 2.11.2"
          url: https://github.com/neuvector/neuvector-helm/compare/v2.11.1...v2.11.2
