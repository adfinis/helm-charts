type: application
version: 0.133.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/security-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated StackRox Central and Secured Cluster Services charts from 400.11.1 to 400.11.3, including:
          - RHACS application update from 4.11.1 to 4.11.3
          - Security fixes for CVE-2026-42504, CVE-2026-39822, CVE-2026-13149,
            CVE-2026-59869, CVE-2026-49978, and CVE-2026-69152
          - Restore CEL scanner profile results in the Coverage view
          - Add NODE_EVENT to the security policy CRD
          - Reschedule pending view-based reports after Central restarts
      links:
        - name: "RHACS 4.11 release notes"
          url: https://docs.redhat.com/en/documentation/red_hat_advanced_cluster_security_for_kubernetes/4.11/html/release_notes/release-notes-411
        - name: "StackRox changes from 4.11.1 to 4.11.3"
          url: https://github.com/stackrox/stackrox/compare/4.11.1...4.11.3
