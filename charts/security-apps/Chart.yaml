apiVersion: v2
name: security-apps
description: Argo CD app-of-apps config for security applications
type: application
version: 0.132.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/security-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated Kyverno and Kyverno Policies charts from 3.8.1 to 3.9.0, including:
          - Application version update to Kyverno v1.19.0
          - ValidatingAdmissionPolicy generation and reporting enabled by default
          - ValidatingPolicy is now the default Kyverno Policies policy type
          - Removed deprecated spec.validationFailureAction in favor of per-rule failureAction
      links:
        - name: "Kyverno release v1.19.0"
          url: https://github.com/kyverno/kyverno/releases/tag/v1.19.0
        - name: "Kyverno chart 3.9.0"
          url: https://artifacthub.io/packages/helm/kyverno/kyverno/3.9.0
        - name: "Kyverno Policies chart 3.9.0"
          url: https://artifacthub.io/packages/helm/kyverno/kyverno-policies/3.9.0
