apiVersion: v2
name: security-apps
description: Argo CD app-of-apps config for security applications
type: application
version: 0.140.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/security-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated Secrets Store CSI Driver chart from 1.6.0 to 1.6.1, including:
          - Secrets Store CSI Driver application update from v1.6.0 to v1.6.1
          - Updated vulnerable image dependencies and Go to fix image CVEs
          - Updated golang.org/x/net to fix GO-2026-4918
          - Prevented a secret update hot loop
          - Corrected the log format for missing target path modification times
      links:
        - name: "Secrets Store CSI Driver v1.6.1 release notes"
          url: https://github.com/kubernetes-sigs/secrets-store-csi-driver/releases/tag/v1.6.1
        - name: "Changes from v1.6.0 to v1.6.1"
          url: https://github.com/kubernetes-sigs/secrets-store-csi-driver/compare/v1.6.0...v1.6.1
