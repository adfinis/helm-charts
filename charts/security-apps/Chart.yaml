annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated Gatekeeper chart from 3.22.2 to 3.23.1, including:
          - Gatekeeper application update from v3.22.2 to v3.23.1
