          - Updated gomplate to v5.0.0, which includes breaking changes
          - Raised the minimum supported Kubernetes version from 1.14 to 1.20
          - Fixed MySQL 8.0+ storage migrations and the chart favicon link
          - Note: upstream reports CVE-2025-68121 and CVE-2026-25934 in the optional gomplate binary
      links:
