      links:
        - name: "StackRox 4.11.4 release notes"
          url: https://github.com/stackrox/stackrox/releases/tag/4.11.4
        - name: "Changes from 4.11.3 to 4.11.4"
          url: https://github.com/stackrox/stackrox/compare/4.11.3...4.11.4
