        - Includes all the dependency updates (grafan, prom, other components, ...)
      links:
        - name: Helm Chart
          url: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
        - name: Upgrade Documentation
          url: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/UPGRADE.md
