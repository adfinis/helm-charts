apiVersion: v2
name: infra-apps
description: Argo CD app-of-apps config for infrastructure components
type: application
version: 0.276.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/infra-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated kubernetes-event-exporter to 3.6.3, including:
          - Improved security defaults
          - NetworkPolicy support and configurable cluster role rules
          - Configurable probes, PodDisruptionBudget, and clusterName value
          - OpenShift runtime adaptation and runAsGroup support
          - tpl support for .Values.config
          - Non-standard image detection and leader election RoleBinding fixes
          - Fix for empty logs with the default config layout
          - Removal of Kubernetes versions below 1.23 support
      links:
        - name: "kubernetes-event-exporter changelog"
          url: https://github.com/bitnami/charts/blob/main/bitnami/kubernetes-event-exporter/CHANGELOG.md
