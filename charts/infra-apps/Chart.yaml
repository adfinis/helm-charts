apiVersion: v2
name: infra-apps
description: Argo CD app-of-apps config for infrastructure components
type: application
version: 0.280.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/infra-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated Argo CD chart from 10.3.0 to 10.8.4, including:
          - Argo CD application update from v3.5.0 to v3.5.2
          - Update Redis to a patched OpenSSL base image
          - Add optional Gateway API h2c service port support
          - Add VPA recommender and startupBoost configuration
          - Prevent high Redis Sentinel CPU usage after rolling upgrades
          - Avoid unnecessary pod restarts on chart-only changes
      links:
        - name: "Argo CD chart 10.8.4"
          url: https://github.com/argoproj/argo-helm/releases/tag/argo-cd-10.8.4
        - name: "Chart changes from 10.3.0 to 10.8.4"
          url: https://github.com/argoproj/argo-helm/compare/argo-cd-10.3.0...argo-cd-10.8.4
        - name: "Argo CD v3.5.2"
          url: https://github.com/argoproj/argo-cd/releases/tag/v3.5.2
