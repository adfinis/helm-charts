apiVersion: v2
name: infra-apps
description: Argo CD app-of-apps config for infrastructure components
type: application
version: 0.282.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/infra-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated Argo CD chart from 10.8.4 to 10.9.5, including:
          - Argo CD application update from v3.5.2 to v3.5.3
          - Added support for a custom Secret name for the embedded Redis password
          - Fixed repository cleanup when changing revisions
          - Fixed health reporting for KubeVirt, Flink, Crossplane, and Gateway API resources
          - Fixed retry operation state handling and an SSO redirect retry loop
      links:
        - name: "Argo CD chart 10.9.5 release notes"
          url: https://github.com/argoproj/argo-helm/releases/tag/argo-cd-10.9.5
        - name: "Argo CD v3.5.3 release notes"
          url: https://github.com/argoproj/argo-cd/releases/tag/v3.5.3
        - name: "Chart changes from 10.8.4 to 10.9.5"
          url: https://github.com/argoproj/argo-helm/compare/argo-cd-10.8.4...argo-cd-10.9.5
