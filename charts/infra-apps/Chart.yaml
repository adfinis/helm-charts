apiVersion: v2
name: infra-apps
description: Argo CD app-of-apps config for infrastructure components
type: application
version: 0.281.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/infra-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated Mimir chart from 6.1.0 to 6.2.0, including:
          - Grafana Mimir application update from 3.1.2 to 3.2.0
          - Reduced the default querier concurrency to 8
          - Added VolumeAttributesClass support for persistent volume claims
          - Added revisionHistoryLimit support for StatefulSet-based components
          - Updated rollout-operator to 0.38.1
          - Fixed KEDA ScaledObject fallback templates
      links:
        - name: "Mimir chart 6.2.0 release notes"
          url: https://grafana.com/docs/helm-charts/mimir-distributed/latest/release-notes/v6.2/
        - name: "Mimir chart changes from 6.1.0 to 6.2.0"
          url: https://github.com/grafana/mimir/compare/mimir-distributed-6.1.0...mimir-distributed-6.2.0
        - name: "Grafana Mimir 3.2.0"
          url: https://github.com/grafana/mimir/releases/tag/mimir-3.2.0
