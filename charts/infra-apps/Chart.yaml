apiVersion: v2
name: infra-apps
description: Argo CD app-of-apps config for infrastructure components
type: application
version: 0.286.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/infra-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: security
      description: |
        Updated argo-cd chart from 10.9.5 to 10.11.6, including:
          - argo-cd application update from 3.5.3 to 3.5.6
          - CRITICAL: A Kustomize remote ref can run commands in the repo-server (GHSA-9v9p-x54c-58gc)
            CRITICAL: A Kustomize Helm config home can run commands in the repo-server (GHSA-fw5c-w8rc-j7fx)
            CRITICAL: A Jsonnet import can read files from the repo-server (GHSA-m3vr-7329-44ww)
            CRITICAL: AppProject restrictions bypassed by PreDelete/PostDelete resource hooks (GHSA-fmxq-cgp8-87wp, CVE-2026-77459)
            HIGH: Login failure rate limit can be bypassed via concurrent requests (GHSA-4439-h7jw-5cjj, CVE-2025-61560)
            HIGH: Command injection via a repository proxy URL on SSH Git repositories (GHSA-j6cw-g6p4-7hch, CVE-2026-55797)
            MODERATE: Extension proxy RBAC ignores application namespace when applications-in-any-namespace is enabled (GHSA-g3ff-q88g-chrj)
            MODERATE: An oversized OCI manifest can exhaust repo-server memory (GHSA-w996-f2wq-x9c6)
      links:
        - name: "ArgoCD 3.5.4 release notes"
          url: https://github.com/argoproj/argo-cd/releases/tag/v3.5.4
        - name: "ArgoCD 3.5.5 release notes"
          url: https://github.com/argoproj/argo-cd/releases/tag/v3.5.5
        - name: "ArgoCD 3.5.6 release notes"
          url: https://github.com/argoproj/argo-cd/releases/tag/v3.5.6
        - name: "Chart changes"
          url: https://github.com/argoproj/argo-helm/compare/argo-cd-10.9.5...argo-cd-10.11.6
