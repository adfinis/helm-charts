apiVersion: v2
name: infra-apps
description: Argo CD app-of-apps config for infrastructure components
type: application
version: 0.276.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/infra-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated Argo CD from 3.4.4 to 3.5.0
          - Helm was upgraded to 4.2.0.
          - Update bundled Redis to 9.6.4
          - Update Redis Exporter to 1.88.0
          - improve listenerset usability
          - fix application-controller ServiceMonitor scrapeTimeout
          - fix applicationSet NetworkPolicy webhook rule when httproute is enabled
          - and more fixes and changes in several areas
      links:
        - name: "Upgrade Notes"
          url: https://argo-cd.readthedocs.io/en/latest/operator-manual/upgrading/3.4-3.5/
