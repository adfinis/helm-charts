apiVersion: v2
name: infra-apps
description: Argo CD app-of-apps config for infrastructure components
type: application
version: 0.283.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/infra-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated cert-manager chart from v1.21.1 to v1.21.2, including:
          - Updated Go, gRPC, and golang.org/x/crypto to address reported security vulnerabilities
          - Prevented untrusted ACME, Vault, and HTTP-01 response bodies from leaking into status and events
          - Restricted ambient AWS credentials for namespaced Vault Issuers
          - Fixed controller and webhook panics and data races
          - Fixed ACME renewal, HTTP-01 solver cleanup, and Gateway API DNS name handling
      links:
        - name: "cert-manager v1.21.2 release notes"
          url: https://github.com/cert-manager/cert-manager/releases/tag/v1.21.2
        - name: "cert-manager changes from v1.21.1 to v1.21.2"
          url: https://github.com/cert-manager/cert-manager/compare/v1.21.1...v1.21.2
