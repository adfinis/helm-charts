apiVersion: v2
name: azure-apps
description: Argo CD app-of-apps config for Azure applications
type: application
version: 0.21.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/azure-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        feat: Update promitor
          chart: "promitor-agent-scraper"

        * update promitor-agent-scraper from 2.15.0 to 2.16.0
          * Provide support for discovering for Azure Private Link services
          * Provide support for discovering for Azure DocumentDB Mongo Clusters
          * Fixed a bug where batching based on aggregation does not work properly
        * update promitor-agent-resource-discovery from 0.15.0 to 0.16.0
          * Provide support for discovering for Azure Private Link services
          * Provide support for discovering for Azure DocumentDB Mongo Clusters
      links:
        - name: Promitor Resource Discovery v0.16.0
          url: https://github.com/tomkerkhove/promitor/releases#release-ResourceDiscovery-v0.16.0
        - name:  Promitor Scraper v2.15.0
          url: https://github.com/tomkerkhove/promitor/releases#release-Scraper-v2.16.0
        - name: Changelog
          url: https://changelog.promitor.io/
