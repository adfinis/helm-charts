apiVersion: v2
name: azure-apps
description: Argo CD app-of-apps config for Azure applications
type: application
version: 0.23.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/azure-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated Promitor Scraper from 2.16.0 to 2.16.1 and Resource Discovery from 0.16.0 to 0.16.1, including:
          * Use the configured Azure authority host when authenticating with SdkDefault.
          * Patch various CVEs in both components.
          * No breaking changes or deprecations.
      links:
        - name: Promitor Scraper v2.16.1
          url: https://github.com/tomkerkhove/promitor/releases/tag/Scraper-v2.16.1
        - name: Promitor Resource Discovery v0.16.1
          url: https://github.com/tomkerkhove/promitor/releases/tag/ResourceDiscovery-v0.16.1
