apiVersion: v2
name: azure-apps
description: Argo CD app-of-apps config for Azure applications
type: application
version: 0.22.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/azure-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        feat: Update Azure Key Vault Provider for Secrets Store CSI Driver
          chart: "csi-secrets-store-provider-azure"

        * update csi-secrets-store-provider-azure from 1.7.2 to 1.8.2
          * update Azure Key Vault Provider from v1.7.2 to v1.8.2
          * update Secrets Store CSI Driver to v1.5.6
          * update CSI sidecar images (node-driver-registrar v2.14.0, livenessprobe v2.15.0)
          * includes bug fixes, dependency updates, and maintenance improvements from the 1.8.x release series
      links:
        - name: Azure Key Vault Provider for Secrets Store CSI Driver v1.8.2
          url: https://github.com/Azure/secrets-store-csi-driver-provider-azure/releases/tag/v1.8.2
