apiVersion: v2
name: azure-apps
description: Argo CD app-of-apps config for Azure applications
type: application
version: 0.22.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/azure-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated azureKvCsiProvider to 1.8.2, including:
          - Identity binding support
          - Pod context validation and secure socket permission handling
          - Managed identity client ID handling fix
          - JSON logger nil panic fix
          - Health check unix socket path parsing fix
          - Kubernetes dependency, Go, gRPC, OAuth2, and OpenTelemetry updates
      links:
        - name: "v1.8.2 Release Notes"
          url: https://github.com/Azure/secrets-store-csi-driver-provider-azure/releases/tag/v1.8.2
        - name: "v1.8.1 Release Notes"
          url: https://github.com/Azure/secrets-store-csi-driver-provider-azure/releases/tag/v1.8.1
