apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "bbook.fullname" . }}-test-connection"
  labels:
    {{- include "bbook.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-q', '-O-', '{{ include "bbook.fullname" . }}:{{ .Values.service.port }}/api/ping']
  restartPolicy: Never
