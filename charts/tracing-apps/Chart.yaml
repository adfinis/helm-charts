apiVersion: v2
name: tracing-apps
description: Argo CD app-of-apps config for tracing applications
type: application
version: 1.4.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/tracing-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: |
        feat!: Updating opentelemetry-collector Chart from 0.151.0 to 0.162.0

        - Update collector from to 0.150.1 to 0.154.0
        - `rewriteDeprecatedProcessorNames` value has been renamed to `rewriteDeprecatedComponentNames`
        - backwards compatibility support for `config.service.telemetry.metrics.address` has been removed
        - The new processor name `k8s_attributes` will only work with Collector versions >= 0.146.0, it was renamed from `k8sattributes`
        - honor `schedulerName` in daemonset and statefulset modes
      links:
        - name: Upgrade Guide
          url: https://github.com/open-telemetry/opentelemetry-helm-charts/blob/main/charts/opentelemetry-collector/UPGRADING.md
        - name: Releasenotes for 0.151.0
          url: https://github.com/open-telemetry/opentelemetry-collector-contrib/releases#release-v0.151.0
        - name: Releasenotes for 0.152.0
          url: https://github.com/open-telemetry/opentelemetry-collector-contrib/releases#release-v0.152.0
        - name: Releasenotes for 0.153.0
          url: https://github.com/open-telemetry/opentelemetry-collector-contrib/releases#release-v0.153.0
        - name: Releasenotes for 0.154.0
          url: https://github.com/open-telemetry/opentelemetry-collector-contrib/releases#release-v0.154.0
