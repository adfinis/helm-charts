apiVersion: v2
name: tracing-apps
description: Argo CD app-of-apps config for tracing applications
type: application
version: 1.6.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/tracing-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated opentelemetry-collector chart from 0.172.0 to 0.174.0, including:
          - Collector application update from 0.159.0 to 0.161.0
          - Removed deprecated Kafka client and exporter authentication options
          - Renamed the dynamic_sampling processor to adaptive_tail_sampling
          - Enabled stable Kubernetes attribute conventions by default
          - Removed the deprecated Mezmo exporter; use OTLP/HTTP instead
          - Added a signing processor for tamper-evident audit logs
      links:
        - name: "OpenTelemetry Collector chart upgrade guide"
          url: https://github.com/open-telemetry/opentelemetry-helm-charts/blob/main/charts/opentelemetry-collector/UPGRADING.md
        - name: "OpenTelemetry Collector Contrib v0.160.0"
          url: https://github.com/open-telemetry/opentelemetry-collector-contrib/releases/tag/v0.160.0
        - name: "OpenTelemetry Collector Contrib v0.161.0"
          url: https://github.com/open-telemetry/opentelemetry-collector-contrib/releases/tag/v0.161.0
        - name: "Chart changes from 0.172.0 to 0.174.0"
          url: https://github.com/open-telemetry/opentelemetry-helm-charts/compare/opentelemetry-collector-0.172.0...opentelemetry-collector-0.174.0
