apiVersion: v2
name: tracing-apps
description: Argo CD app-of-apps config for tracing applications
type: application
version: 1.5.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/tracing-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated opentelemetry-collector chart from 0.162.0 to 0.172.0, including:
          - Collector application update from 0.154.0 to 0.159.0
          - Automatically rewrite filelog receivers to file_log by default
          - Automatically rewrite otlp and otlphttp exporters to otlp_grpc and otlp_http by default
          - Add an opt-in k8s_events receiver for the kubernetesEvents preset
          - Template extraEnvs and extraEnvsFrom; existing template syntax must be escaped
      links:
        - name: Upgrade Guide
          url: https://github.com/open-telemetry/opentelemetry-helm-charts/blob/main/charts/opentelemetry-collector/UPGRADING.md
        - name: OpenTelemetry Collector Contrib v0.159.0
          url: https://github.com/open-telemetry/opentelemetry-collector-contrib/releases/tag/v0.159.0
        - name: Chart changes from 0.162.0 to 0.172.0
          url: https://github.com/open-telemetry/opentelemetry-helm-charts/compare/opentelemetry-collector-0.162.0...opentelemetry-collector-0.172.0
