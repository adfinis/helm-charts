          - Updated CSI sidecar images
          - Added controller.extraArgs support for sidecar containers
          - Increased the Windows node plugin liveness probe timeout
      links:
        - name: "CSI Driver SMB 1.20.2 release notes"
          url: https://github.com/kubernetes-csi/csi-driver-smb/releases/tag/v1.20.2
        - name: "CSI Driver SMB 1.20.3 release notes"
          url: https://github.com/kubernetes-csi/csi-driver-smb/releases/tag/v1.20.3
        - name: "Changes from 1.20.1 to 1.20.3"
          url: https://github.com/kubernetes-csi/csi-driver-smb/compare/v1.20.1...v1.20.3
