annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated CSI Driver SMB chart from 1.20.1 to 1.20.3, including:
          - Fixed CVE-2026-33186 in google.golang.org/grpc
          - Fixed CVE-2026-25680
