apiVersion: v2
name: storage-apps
description: Argo CD app-of-apps config for storage applications
type: application
version: 0.25.0
home: https://github.com/adfinis/helm-charts/tree/main/charts/storage-apps
sources:
  - https://github.com/adfinis/helm-charts
maintainers:
  - name: adfinis
    email: support@adfinis.com
    url: https://adfinis.com
dependencies:
  - name: argoconfig
    version: 0.9.1
    repository: https://charts.adfinis.com
annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: |
        Updated cephCsiRbd and cephCsiCephfs from 3.17.0 to 3.17.1, including:
          * Updated the Ceph base image to 20.2.4 with AES256 key format support.
          * Fixed RBD replication cleanup and connection leaks.
          * Fixed the integrated DEK store key size and read-only volume usage checks.
          * AES256 key support requires Linux kernel 7.0 or a supported backport.
          * Ceph Tentacle 20.2.0 may cause CephFS data loss when readAffinity is enabled.
      links:
        - name: "CephCsi v3.17.1 Release Notes"
          url: "https://github.com/ceph/ceph-csi/releases/tag/v3.17.1"
        - name: "Migration Guide"
          url: "https://github.com/ceph/ceph-csi-operator/blob/main/docs/migration.md"
